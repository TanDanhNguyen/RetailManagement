
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: retail-management-api:1.0
    container_name: retail-management-api
    ports:
      - "8080:8080"
    environment:
      DB_URL: "jdbc:sqlserver://host.docker.internal:14330;databaseName=RetailManagementDb;encrypt=true;trustServerCertificate=true"
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    restart: unless-stopped
